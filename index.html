<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigman's Bargains</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #1e3a5f;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            margin: 15px auto;
            max-width: 350px;
            border-radius: 10px;
            box-shadow: 0 2px 5px #ccc;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Brigman's Bargains</h1>
        <p>Great Deals. Great Prices.</p>
    </header>

    <div class="container">

        <h2>Welcome to Our Store!</h2>

        <p>
            Affordable tools, electronics,
            clothing, and household items.
        </p>

        <h2>Featured Items</h2>

        <div class="product">
            <h3>Mini Refrigerator</h3>
            <p>Good Condition</p>
            <p class="price">$20</p>
        </div>

        <div class="product">
            <h3>Brand New Drones</h3>
            <p>New Condition</p>
            <p class="price">$30</p>
        </div>

        <div class="product">
            <h3>Toyota Corolla</h3>
            <p>Runs and drives. Needs work.</p>
            <p class="price">$800</p>
        </div>

    </div>

</body>
</html>
